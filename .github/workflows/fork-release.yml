name: Fork Release

on:
  push:
    branches: [persian]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vela-persian-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate and decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is missing or empty."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vela-release.jks"
          test -s "$RUNNER_TEMP/vela-release.jks"
          echo "VELA_KEYSTORE_PATH=$RUNNER_TEMP/vela-release.jks" >> "$GITHUB_ENV"
          echo "VELA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "VELA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "VELA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Fetch offline routing runtime
        run: |
          set -euo pipefail
          mkdir -p core/libs
          for f in osmand-java.jar osmand-shared-jvm.jar gnu-trove-osmand.jar kxml2-vela.jar; do
            curl -fSL --retry 3 -o "core/libs/$f" \
              "https://github.com/PimpinPumpkin/Vela/releases/download/obf-runtime/$f"
          done
          test "$(stat -c%s core/libs/osmand-java.jar)" -gt 10000000
          test "$(stat -c%s core/libs/osmand-shared-jvm.jar)" -gt 1000000
          test "$(stat -c%s core/libs/gnu-trove-osmand.jar)" -gt 100000
          test "$(stat -c%s core/libs/kxml2-vela.jar)" -gt 10000

      - name: Fetch Cronet runtime
        run: |
          set -euo pipefail
          version="$(sed -n 's/^vela.cronetVersion=//p' gradle.properties)"
          mkdir -p app/libs
          target="app/libs/cronet-$version.aar"
          curl -fSL --retry 3 -o "$target" \
            "https://github.com/PimpinPumpkin/Vela/releases/download/cronet-runtime/cronet-$version.aar" \
            || bash scripts/build-cronet-aar.sh "$version" app/libs
          test "$(stat -c%s "$target")" -gt 10000000

      - name: Fetch neural TTS runtime
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fSL --retry 3 -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/PimpinPumpkin/Vela/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar"
          test "$(stat -c%s app/libs/sherpa-onnx-1.13.3.aar)" -gt 50000000

      - name: Run core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name="0.5.${GITHUB_RUN_NUMBER}"
          version_code="$(( (2000 + GITHUB_RUN_NUMBER) * 10 ))"
          ./gradlew :app:assembleRelease --no-daemon \
            -PappVersionName="$version_name" \
            -PappVersionCode="$version_code"

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APK was generated."
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the Android SDK."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose --print-certs "$apk"
          done

          tag="fork-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --title "Vela Fork $version_name" \
            --notes "Signed Vela fork build. Application ID preserved from upstream (app.vela)." \
            --prerelease \
            --target "$GITHUB_SHA" || true
          for apk in "${apks[@]}"; do
            gh release upload "$tag" "$apk" --clobber
          done

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/vela-release.jks"
