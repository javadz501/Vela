name: CI

# Three channels (2026-08-07). Pushes to main and canary BUILD + TEST only;
# signed APKs are published directly to GitHub Releases by the channel steps below. The NIGHTLY prerelease is cut once
# a day by the cron below (skipped when main has not moved since the last nightly),
# or on demand via workflow_dispatch when a fix genuinely cannot wait for the cron.
# The weekly promote-stable workflow still flips the newest nightly to stable.
# canary is the working branch: batches assemble there and merge to main when ready.
on:
  schedule:
    # Daily nightly cut, 10:30 UTC. Publishes only if main moved since the last v0.* tag.
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Cut a release even if main has not moved since the last one
        type: boolean
        default: false
  push:
    branches: [ main, canary, persian ]
    # Docs-only pushes don't build or cut a nightly - nothing in the APK changed, and
    # every push was minting a release (a dozen doc commits on 2026-07-09 became a dozen
    # identical nightlies). A push that MIXES docs and code still builds: paths-ignore
    # only skips when every changed file matches. Escape hatch either way: put
    # "[skip ci]" in the commit subject to suppress a run, or touch any code file to
    # force one. Keep this list to things that provably never reach the APK - workflow
    # files are NOT ignored on purpose (they change the build itself). The cron nightly
    # reads the same list from scripts/app-changed.sh; keep the two in step.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'fdroid/metadata/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'site/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'fdroid/metadata/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'site/**'

# `contents: write` is needed to publish channel releases. Publish steps are
# restricted to main/canary/persian; pull requests never publish.
permissions:
  actions: read
  contents: write

# A newer commit on the same branch supersedes an older build. Every Persian build is
# archived under an immutable versioned tag before the rolling preview release is replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the release step can build a changelog from the
          # commits since the previous release.
          fetch-depth: 0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Default installs the legacy `tools` package, which drags in the
          # Android Emulator — a large, flaky download that failed CI at the setup
          # step ("ZipFile unknown archive"). We only build + unit-test, so
          # platform-tools is enough; the Android Gradle Plugin fetches the
          # platform + build-tools it needs on its own.
          packages: platform-tools

      - name: Check the Gradle wrapper
        # The wrapper jar is the one binary in the repository; this checks it is Gradle's own.
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Validate and decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is missing or empty."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vela-release.jks"
          test -s "$RUNNER_TEMP/vela-release.jks"

      - name: Fetch obf routing runtime jars
        # OsmAnd's Java router + obf reader (:core's offline routing engine, GPLv3 like Vela).
        # No Maven artifacts exist, so they live on the fixed-tag `obf-runtime` release,
        # gitignored out of the repo - same arrangement as the TTS AAR above.
        run: |
          mkdir -p core/libs
          for f in osmand-java.jar osmand-shared-jvm.jar gnu-trove-osmand.jar kxml2-vela.jar; do
            curl -fSL -o "core/libs/$f" \
              "https://github.com/${{ github.repository }}/releases/download/obf-runtime/$f" \
            || curl -fSL -o "core/libs/$f" \
              "https://github.com/PimpinPumpkin/Vela/releases/download/obf-runtime/$f"
          done
          test "$(stat -c%s core/libs/osmand-java.jar)" -gt 10000000
          test "$(stat -c%s core/libs/osmand-shared-jvm.jar)" -gt 1000000
          test "$(stat -c%s core/libs/gnu-trove-osmand.jar)" -gt 100000
          test "$(stat -c%s core/libs/kxml2-vela.jar)" -gt 10000

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Check translations
        # Android lint's MissingTranslation doesn't run on assemble/test, so a missed locale
        # backfill ships silently (English shown for that key). Fail fast if any translatable
        # string is absent from a locale or its placeholders drifted. Intentionally-English-only
        # strings are marked translatable="false" in res/values/strings.xml and skipped.
        run: python3 tools/check-translations.py

      - name: Bake script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: D-pad audit
        # Every control has a focus ring and every gesture a key path (docs/dpad.md). Reads the
        # source only; no device.
        run: bash dpad_test_suite/audit_static.sh

      - name: Derive build version
        id: ver
        # versionName is plain semver (0.5.<run>) so Obtainium can compare it. The minor is a name
        # (0.4 until 2026-10-08): the run number is what orders releases, across minors too.
        # versionCode is (2000+run)*10 since 2026-09-23 (was 2000+run): the last digit is the chip
        # type in a per-chip build (app/build.gradle.kts `splits`, the ABI_SPLITS repo variable),
        # 0 for the all-in-one APK. The jump is one-way and every build is still an upgrade; the
        # in-app updater folds both scales onto 2000+run (update/ApkChoice.kt, legacyCode).
        # NOTE: bumped from 0.1.<run> / 1000+run on 2026-06-18 — local dev builds
        # had been hand-set with -PappVersionCode in the 1000s (up to 1117) and got
        # installed on a test phone, leaving it *ahead* of the release line so
        # Obtainium would reject the next release as a downgrade. 0.2 + 2000-base
        # steps the release line decisively over that pollution. Keep local dev
        # builds BELOW 1000 (e.g. -PappVersionCode=1) so this can't recur.
        run: |
          # Canary builds carry a -canary suffix in the NAME so About/version screens read
          # honestly; the CODE stays on the one monotonic (2000+run)*10 line for every channel, so
          # moving between canary/nightly/stable is always a plain upgrade for the installer.
          if [ "${{ github.ref }}" = "refs/heads/canary" ]; then
            echo "name=0.5.${{ github.run_number }}-canary" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.5.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$(( (2000 + ${{ github.run_number }}) * 10 ))" >> "$GITHUB_OUTPUT"

      - name: Fetch Cronet runtime AAR
        # Chromium's own prebuilt Cronet for the version pinned in gradle.properties, packed as one
        # AAR (gitignored). From the `cronet-runtime` infra release, else the upstream repo's, else
        # packed right here from Chromium's bucket by the same script the release uses.
        run: |
          v=$(sed -n 's/^vela.cronetVersion=//p' gradle.properties)
          f="app/libs/cronet-$v.aar"
          mkdir -p app/libs
          curl -fsSL -o "$f" "https://github.com/${{ github.repository }}/releases/download/cronet-runtime/cronet-$v.aar" \
          || curl -fsSL -o "$f" "https://github.com/PimpinPumpkin/Vela/releases/download/cronet-runtime/cronet-$v.aar" \
          || bash scripts/build-cronet-aar.sh "$v" app/libs
          test "$(stat -c%s "$f")" -gt 10000000

      - name: App unit tests
        # The app module resolves Cronet's AAR during resource processing, so run these after fetching it.
        run: ./gradlew :app:test --no-daemon

      - name: Build release APK
        env:
          VELA_KEYSTORE_PATH: ${{ runner.temp }}/vela-release.jks
          VELA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VELA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VELA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}
          -PmaptilerKey=${{ secrets.MAPTILER_KEY }}
          ${{ (github.ref == 'refs/heads/persian' || vars.ABI_SPLITS == 'true') && '-PabiSplits' || '' }}

      - name: Verify APK package and signing identity
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APK was generated."
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -n "$apksigner" || { echo "::error::apksigner missing"; exit 1; }
          test -n "$aapt" || { echo "::error::aapt missing"; exit 1; }
          expected_cert="BE0F299439C8B2A6B86BFFFD781E4BE714118DDA0842E793A90DC367C2EB594C"
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose --print-certs "$apk"
            package="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
            test "$package" = "app.vela.fork" || { echo "::error::Unexpected applicationId: $package"; exit 1; }
            cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$cert" = "$expected_cert" || { echo "::error::Signing certificate does not match upstream Vela identity."; exit 1; }
            printf 'Verified %s: applicationId=%s, certificate=%s\n' "$apk" "$package" "$cert"
          done

      - name: Verify repository state with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth status
          BRANCH_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/persian" --jq '.commit.sha')"
          test "$BRANCH_SHA" = "$GITHUB_SHA"
          RUN_SHA="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          test "$RUN_SHA" = "$GITHUB_SHA"
          printf 'CLI verified branch and run commit: %s\n' "$GITHUB_SHA"

      - name: Archive current Persian build (immutable release)
        # Keep every successful Persian APK under a version-specific tag. These tags do not
        # match the v0.* filter used by the nightly-pruning job and are never automatically deleted.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/persian'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          ARCHIVE_TAG="persian-v${VER}"
          test -s "$APK"
          cp "$APK" vela-maps-persian.apk
          NOTES="$(printf 'Archived Persian preview build — ARM64 (arm64-v8a) only. This fork uses applicationId app.vela.fork and its established signing identity.\n\nversionName: %s\nversionCode: %s\narchitecture: arm64-v8a\ncommit: %s\n' "$VER" "$CODE" "$GITHUB_SHA")"
          META="$RUNNER_TEMP/persian-archive-current.json"
          ARCHIVE_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$ARCHIVE_TAG"
          if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$ARCHIVE_URL" -o "$META"; then
            EXISTING_TARGET="$(jq -r '.target_commitish // empty' "$META")"
            HAS_APK="$(jq -r '[.assets[].name] | any(. == "vela-maps-persian.apk")' "$META")"
            if [ "$EXISTING_TARGET" != "$GITHUB_SHA" ] || [ "$HAS_APK" != "true" ]; then
              echo "::error::Immutable archive $ARCHIVE_TAG already exists but does not match this build. Refusing to overwrite it."
              exit 1
            fi
            echo "Immutable archive $ARCHIVE_TAG already exists and matches this build."
          else
            gh release create "$ARCHIVE_TAG" vela-maps-persian.apk \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Vela Persian Preview $VER" \
              --notes "$NOTES"
          fi

      - name: Preserve previous rolling Persian APK
        # Tag protection prevents retargeting the legacy rolling tag. Preserve its exact APK
        # as a clearly named asset on the current immutable release instead.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/persian'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          META="$RUNNER_TEMP/persian-rolling-release.json"
          ROLLING_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/persian"
          if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$ROLLING_URL" -o "$META"; then
            echo "No previous rolling Persian release exists; skipping legacy APK preservation."
            exit 0
          fi

          PREV_NOTES="$(jq -r '.body // empty' "$META")"
          PREV_SHA="$(printf '%s\n' "$PREV_NOTES" | sed -n 's/^commit: //p' | head -n1)"
          PREV_VERSION="$(printf '%s\n' "$PREV_NOTES" | sed -n 's/^versionName: //p' | head -n1)"
          PREV_APK_URL="$(jq -r '.assets[] | select(.name == "vela-maps-persian.apk") | .browser_download_url' "$META")"
          if [[ ! "$PREV_VERSION" =~ ^0\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || \
             [[ ! "$PREV_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ -z "$PREV_APK_URL" ] || [ "$PREV_APK_URL" = "null" ]; then
            echo "::error::Previous rolling release metadata is incomplete. Refusing to discard the old APK."
            exit 1
          fi

          DOWNLOAD_DIR="$RUNNER_TEMP/persian-previous-apk"
          mkdir -p "$DOWNLOAD_DIR"
          gh release download persian --repo "$GITHUB_REPOSITORY" --pattern "vela-maps-persian.apk" --dir "$DOWNLOAD_DIR" --clobber
          test -s "$DOWNLOAD_DIR/vela-maps-persian.apk"

          CURRENT_TAG="persian-v${{ steps.ver.outputs.name }}"
          CURRENT_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$CURRENT_TAG"
          CURRENT_META="$RUNNER_TEMP/persian-current-archive.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$CURRENT_URL" -o "$CURRENT_META"
          CURRENT_RELEASE_ID="$(jq -r '.id // empty' "$CURRENT_META")"
          if [[ ! "$CURRENT_RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Current immutable Persian release is unavailable."
            exit 1
          fi

          LEGACY_ASSET="vela-maps-persian-${PREV_VERSION}.apk"
          if jq -e --arg name "$LEGACY_ASSET" '[.assets[].name] | any(. == $name)' "$CURRENT_META" >/dev/null; then
            echo "Legacy APK $LEGACY_ASSET is already preserved."
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$DOWNLOAD_DIR/vela-maps-persian.apk" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$CURRENT_RELEASE_ID/assets?name=$LEGACY_ASSET" \
              --output "$RUNNER_TEMP/persian-legacy-upload.json"
            test "$(jq -r '.name' "$RUNNER_TEMP/persian-legacy-upload.json")" = "$LEGACY_ASSET"
            test "$(jq -r '.state' "$RUNNER_TEMP/persian-legacy-upload.json")" = "uploaded"
          fi

          # Remove only the malformed archive created by the earlier attempt, after its APK is safe.
          BAD_ARCHIVE_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/persian-v$PREV_VERSION"
          BAD_ARCHIVE_META="$RUNNER_TEMP/persian-malformed-archive.json"
          if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$BAD_ARCHIVE_URL" -o "$BAD_ARCHIVE_META"; then
            BAD_TARGET="$(jq -r '.target_commitish // empty' "$BAD_ARCHIVE_META")"
            BAD_ID="$(jq -r '.id // empty' "$BAD_ARCHIVE_META")"
            if [ "$BAD_TARGET" != "$PREV_SHA" ] && [[ "$BAD_ID" =~ ^[0-9]+$ ]]; then
              if gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$BAD_ID"; then
                echo "Removed the incorrectly targeted legacy release; the original APK is preserved as $LEGACY_ASSET."
              else
                echo "::warning::Could not remove the incorrectly targeted legacy release; the original APK is preserved as $LEGACY_ASSET."
              fi
            fi
          fi

      - name: Publish persian branch build (rolling release)
        # Update the existing release object and asset without changing its protected Git tag.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/persian'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          ARM64_APK="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s "$ARM64_APK"
          cp "$ARM64_APK" vela-maps-persian.apk
          NOTES="$(printf 'Persian preview build — ARM64 (arm64-v8a) only. This fork is signed with its own established keystore and is not update-compatible with the official upstream Vela signing key. This fork uses applicationId app.vela.fork and can be installed alongside official Vela. App data and offline downloads remain separate. UI localization is in progress and untranslated strings fall back to English. Persian navigation uses phone TTS when no Persian neural voice is installed.\n\nversionName: %s\nversionCode: %s\narchitecture: arm64-v8a\ncommit: %s\n' "$VER" "$CODE" "$GITHUB_SHA")"

          ROLLING_META="$RUNNER_TEMP/persian-rolling-publish.json"
          ROLLING_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/persian"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$ROLLING_URL" -o "$ROLLING_META"
          RELEASE_ID="$(jq -r '.id // empty' "$ROLLING_META")"
          ASSET_ID="$(jq -r '.assets[] | select(.name == "vela-maps-persian.apk") | .id' "$ROLLING_META")"
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]] || [[ ! "$ASSET_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Existing rolling release or APK asset metadata is incomplete."
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="Vela Persian Preview Build" \
            -f body="$NOTES" \
            -F prerelease=true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@vela-maps-persian.apk" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=vela-maps-persian.apk" \
            --output "$RUNNER_TEMP/persian-upload.json"
          test "$(jq -r '.name' "$RUNNER_TEMP/persian-upload.json")" = "vela-maps-persian.apk"
          test "$(jq -r '.state' "$RUNNER_TEMP/persian-upload.json")" = "uploaded"

      - name: Verify published release with GitHub CLI
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/persian'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/persian"
          RELEASE_META="$RUNNER_TEMP/persian-release-check.json"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$RELEASE_URL" -o "$RELEASE_META"
          test "$(jq -r '.tag_name' "$RELEASE_META")" = "persian"
          test "$(jq -r '.prerelease' "$RELEASE_META")" = "true"
          grep -Fq "commit: $GITHUB_SHA" <(jq -r '.body' "$RELEASE_META")
          APK_URL="$(jq -r '.assets[] | select(.name == "vela-maps-persian.apk") | .browser_download_url' "$RELEASE_META")"
          test -n "$APK_URL" && [ "$APK_URL" != "null" ]
          mkdir -p "$RUNNER_TEMP/persian-release-check"
          gh release download persian --repo "$GITHUB_REPOSITORY" --pattern "vela-maps-persian.apk" --dir "$RUNNER_TEMP/persian-release-check" --clobber
          test -s "$RUNNER_TEMP/persian-release-check/vela-maps-persian.apk"
          EXPECTED_SHA="$(sha256sum vela-maps-persian.apk | awk '{print $1}')"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/persian-release-check/vela-maps-persian.apk" | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose --print-certs "$RUNNER_TEMP/persian-release-check/vela-maps-persian.apk"

      - name: Publish canary build (rolling release)
        # The canary CHANNEL: every push to the canary branch replaces the single APK on the
        # fixed-tag `canary` release. Not a v0.* tag on purpose - the nightly/stable queries,
        # the prune and the F-Droid build all bound to v0.* and never see it, and the in-app
        # updater reads the versionCode line out of the release notes instead of the tag.
        if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          mapfile -t APKS < <(bash scripts/stage-apks.sh vela-maps-canary vela-maps-canary.apk)
          # The newest change a USER can see (docs-only and comment-only commits are skipped,
          # scripts/changelog.sh), falling back to the plain subject when nothing qualifies.
          SUBJ="$(bash scripts/changelog.sh --latest HEAD)"
          [ -z "$SUBJ" ] && SUBJ="$(git log -1 --no-merges --pretty=%s)"
          # The in-app What's new dialog shows this body verbatim, so the first line is a label,
          # not a warning paragraph (user 2026-09-15).
          NOTES="$(printf 'Canary branch.\n\nversionName: %s\nversionCode: %s\n\nLatest change: %s\n' "$VER" "$CODE" "$SUBJ")"
          # RECREATED on every push, not edited (2026-09-22): GitHub lists releases by creation
          # date, so an edited-in-place release created in August sat fifteen rows down, under
          # every nightly and every data release, and "where is canary 1753" was the question.
          # Deleting and recreating moves it to the top, names it after the build, and moves the
          # tag to the pushed commit; the download URL (releases/download/canary/...) and the
          # updater's releases/tags/canary lookup are unchanged, with a few seconds of 404
          # during the swap that the updater reads as "nothing newer".
          # Retried as a pair (scripts/gh-retry.sh): a create refused by the API limit after the
          # delete had gone through left users with no canary release until the next push.
          # A build that a newer push has overtaken leaves the release to that newer build.
          # Published late it would put an older APK on the channel, and when the newer push
          # changed a workflow file GitHub refuses this run's tag: every retry answered HTTP 403
          # for half an hour and the run ended red, ten times in ten days.
          overtaken() {
            local tip
            tip="$(git ls-remote origin refs/heads/canary 2>/dev/null | cut -f1)"
            [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]
          }
          source scripts/gh-retry.sh
          publish_canary() {
            if overtaken; then
              echo "canary has moved past ${GITHUB_SHA:0:9}: the newer build publishes."
              return 0
            fi
            gh release delete canary --yes --cleanup-tag 2>/dev/null || true
            gh release create canary --prerelease --target "$GITHUB_SHA" --title "Vela $VER" --notes "$NOTES" "${APKS[@]}"
          }
          gh_retry publish_canary

      - name: Publish nightly (prerelease)
        # The nightly channel: ONE prerelease per day from the cron (or an on-demand
        # dispatch for an urgent fix), never per push. Obtainium users who want nightlies
        # turn on "include prereleases"; everyone else keeps tracking the latest stable
        # release, which the weekly promote-stable workflow produces by flipping the
        # newest nightly to a full release (same APK, no rebuild; nothing checks its health).
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nothing new since the last nightly -> no release (the cron fires daily
          # regardless; force=true on a manual dispatch overrides for a same-code recut).
          LAST="$(git tag -l 'v0.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -n "$LAST" ] && \
             [ "$(git rev-parse "${LAST}^{commit}")" = "$(git rev-parse HEAD)" ] && \
             [ "${{ github.event.inputs.force || 'false' }}" != "true" ]; then
            echo "main has not moved since $LAST - no nightly today."
            exit 0
          fi
          # The cron skips a main that moved only in docs, the website or repo metadata (the
          # weekly reach snapshot cut identical nightlies). A dispatch always cuts.
          if [ -n "$LAST" ] && [ "${{ github.event_name }}" = "schedule" ] && \
             ! bash scripts/app-changed.sh "$LAST" HEAD; then
            echo "only docs or the website changed since $LAST - no nightly today."
            exit 0
          fi
          VER="0.5.${{ github.run_number }}"
          mapfile -t APKS < <(bash scripts/stage-apks.sh vela-maps "vela-maps-v${VER}.apk")
          # Build the changelog from the commit subjects since the previous release. Our commit
          # subjects are written as plain-language changelog lines, so this reads as real release
          # notes (what Obtainium shows people), not a raw hash dump.
          PREV="$LAST"
          if [ -n "$PREV" ]; then
            LOG="$(bash scripts/changelog.sh "${PREV}..HEAD")"
            COMPARE="**Full changelog:** https://github.com/${{ github.repository }}/compare/${PREV}...v${VER}"
          else
            LOG="$(bash scripts/changelog.sh -n 20 HEAD)"
            COMPARE=""
          fi
          [ -z "$LOG" ] && LOG="- Maintenance and internal changes"
          # The title and the first line say NIGHTLY: the release page listed nightlies and
          # stables with the same "Vela 0.5.N" title and only the prerelease badge apart, and the
          # in-app What's new dialog shows the body verbatim, so people could not tell which
          # channel they were reading (user 2026-09-21). promote-stable.yml retitles and rewrites.
          NOTES="$(printf 'Nightly build.\n\nWhat'\''s changed in %s\n\n%s\n\n%s\n' "$VER" "$LOG" "$COMPARE")"
          source scripts/gh-retry.sh
          publish_nightly() {
            # A try refused half way (release made, an upload refused) is cleared before the next.
            gh release delete "v${VER}" --yes --cleanup-tag 2>/dev/null || true
            gh release create "v${VER}" \
              --title "Vela $VER nightly" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --notes "$NOTES" \
              "${APKS[@]}"
          }
          gh_retry publish_nightly

      - name: Prune old nightlies (stables are kept for good)
        # STABLES ARE NEVER DELETED. They are the changelog, they are what somebody bisecting a
        # regression needs to install, and their download counters are the only measure of reach
        # this project has - a deleted release takes its counter with it. One a week at about a
        # hundred megabytes is nothing beside the data catalogs this repo already hosts.
        #
        # Nightlies keep a rolling thirty, which is a month of bisect range and a month for the
        # weekly reach snapshot (docs/stats) to record one before it goes.
        #
        # The FULL list of app releases, newest first (scripts/app-releases.sh): an earlier version
        # used `gh release list --limit 200` and never saw past the newest 200, so hundreds of
        # early nightlies sat untouched forever.
        # The tag filter is LOAD BEARING: the infrastructure releases (tts-runtime, poi-packs,
        # basemap-tiles, obf-regions, places-overlays, road-features, flock-cameras, asr-models)
        # are prereleases too and host live download assets - only v0.* tags are app releases;
        # never widen this filter.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A listing that fails prunes nothing: the nightly above is already out, and a red
          # run here would stop a release that is waiting on this one.
          if ! GH_RETRY_TRIES=3 bash scripts/app-releases.sh > /tmp/app-releases.txt; then
            echo "::warning::Could not list the releases; nothing pruned this run."
            exit 0
          fi
          awk -F'\t' '$2 == "true" { print $1 }' /tmp/app-releases.txt | tail -n +31 > /tmp/doomed.txt
          echo "keeping every stable; pruning $(wc -l < /tmp/doomed.txt) old nightlies"
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "pruning $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done < /tmp/doomed.txt
